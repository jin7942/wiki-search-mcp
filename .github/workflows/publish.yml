# PyPI 자동 배포 워크플로우 (Trusted Publisher / OIDC)
#
# 트리거: vX.Y.Z 형식 tag push
#   git tag v0.1.0
#   git push origin v0.1.0
#
# 동작:
#   1. Ubuntu 컨테이너에서 sdist + wheel 빌드 (hatch-vcs가 tag 기반 버전 생성)
#   2. twine으로 메타데이터 검증
#   3. PyPI에 업로드 (OIDC 인증, API 토큰 불필요)
#
# 사전 설정:
#   - PyPI에서 Trusted Publisher 등록:
#     https://pypi.org/manage/account/publishing/
#     Owner: jin7942 / Repository: wiki-search-mcp / Workflow: publish.yml / Environment: pypi
#   - GitHub Settings → Environments → New environment 'pypi'

name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'  # v0.1.0, v1.2.3 등 semver tag만

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs가 tag를 읽으려면 전체 히스토리 필요

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify metadata
        run: twine check dist/*

      - name: Verify version matches tag
        run: |
          # tag 'v0.1.0' → 빌드 결과는 정확히 '0.1.0' 이어야 함
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BUILT_VERSION=$(ls dist/wiki_search_mcp-*.tar.gz | sed -E 's|.*/wiki_search_mcp-(.+)\.tar\.gz|\1|')
          echo "Tag version:   $TAG_VERSION"
          echo "Built version: $BUILT_VERSION"
          if [ "$TAG_VERSION" != "$BUILT_VERSION" ]; then
            echo "::error::Version mismatch: tag=$TAG_VERSION, built=$BUILT_VERSION"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wiki-search-mcp
    permissions:
      id-token: write  # Trusted Publisher용 OIDC 토큰
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # 기본 설정: PyPI 본 저장소로 업로드
        # TestPyPI 사용 시 repository-url 추가 가능
