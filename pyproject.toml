[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "wiki-search-mcp"
dynamic = ["version"]
description = "Zero-config PKM MCP server: auto-classify, search, and organize personal markdown notes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "jin7942", email = "iam@jin7942.dev" }
]
keywords = ["mcp", "pkm", "wiki", "search", "auto-classification", "vector", "semantic", "rag", "obsidian"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.0.0",
    "lancedb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "watchdog>=3.0.0",
    "rank_bm25>=0.2.2",
    "claude-agent-sdk>=0.1.81",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
wiki-search-mcp = "wiki_search_mcp.adapters.cli.main:main"

[project.urls]
Homepage = "https://github.com/jin7942/wiki-search-mcp"
Repository = "https://github.com/jin7942/wiki-search-mcp"
Issues = "https://github.com/jin7942/wiki-search-mcp/issues"
Changelog = "https://github.com/jin7942/wiki-search-mcp/blob/main/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
# 릴리즈 워크플로우: git tag vX.Y.Z 직후에만 빌드 → 정확히 X.Y.Z 출력.
# only_version: tag가 HEAD에 정확히 있을 때만 그 버전 사용. dev 접미사 안 붙음.
# tag 없거나 tag 이후 커밋이 있으면 fallback-version("0.0.0") 사용.
# local_scheme=no-local-version: PyPI는 +g{sha} local 버전 미허용.
version_scheme = "only-version"
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/wiki_search_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_search_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/**/*",
    "tests/**/*",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pylint.main]
# 테스트는 검증 로직을 그대로 비교하는 특성상 중복이 자연스러움.
# tests/는 분석 대상에서 제외.
ignore-paths = ["tests/.*", "src/wiki_search_mcp/_version.py"]

[tool.pylint."messages control"]
disable = [
    # 도메인 모델/검증기 등은 같은 검사 패턴이 반복되는 것이 자연스러움.
    "duplicate-code",
    # 한국어 docstring/주석을 자주 사용 → 문서 품질 false-positive 감소
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    # 1인 프로젝트, refactor 항목은 수동 관리
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-instance-attributes",
    "too-many-positional-arguments",
    "fixme",
]

[tool.pylint.format]
max-line-length = 120
