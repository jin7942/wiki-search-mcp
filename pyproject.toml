[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "wiki-search-mcp"
dynamic = ["version"]
description = "Zero-config PKM MCP server: auto-classify, search, and organize personal markdown notes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "jin7942", email = "iam@jin7942.dev" }
]
keywords = ["mcp", "pkm", "wiki", "search", "auto-classification", "vector", "semantic", "rag", "obsidian"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.0.0",
    "lancedb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "watchdog>=3.0.0",
    "rank_bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
wiki-search-mcp = "wiki_search_mcp.adapters.cli.main:main"

[project.urls]
Homepage = "https://github.com/jin7942/wiki-search-mcp"
Repository = "https://github.com/jin7942/wiki-search-mcp"
Issues = "https://github.com/jin7942/wiki-search-mcp/issues"
Changelog = "https://github.com/jin7942/wiki-search-mcp/blob/main/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/wiki_search_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_search_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/**/*",
    "tests/**/*",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
